<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bazaar — live market</title>
<style>
  :root {
    --page: #edebe6;
    --panel: #ffffff;
    --ink: #211f1b;
    --muted: #5d5a52;
    --line: #d9d5cb;
    --green: #1d5c38;
    --green-bg: #e3efe6;
    --red: #b3341f;
    --red-bg: #f7e3dd;
    --amber: #8a5a00;
    --amber-bg: #f4e8cf;
    --slate: #33414e;
    --slate-bg: #e2e7ec;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.45;
  }
  header.top {
    display: flex;
    align-items: baseline;
    gap: 18px;
    flex-wrap: wrap;
    padding: 14px 22px;
    background: var(--ink);
    color: #f2efe8;
  }
  .wordmark { font-family: Georgia, "Times New Roman", serif; font-size: 26px; letter-spacing: 2px; }
  .wordmark small { font-family: system-ui, sans-serif; font-size: 12px; letter-spacing: 0; color: #b9b4a8; margin-left: 10px; }
  .status { margin-left: auto; display: flex; gap: 16px; align-items: center; font-size: 13px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 999px; background: #8a8a8a; margin-right: 6px; }
  .dot.live { background: #4cc38a; }
  .reserve { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; color: #f2efe8; }
  main {
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
    gap: 16px;
    padding: 16px 22px 28px;
    max-width: 1280px;
    margin: 0 auto;
  }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section.panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 16px;
  }
  section.panel h2 {
    margin: 0 0 10px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .brief-grid { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; }
  .brief-grid dt { color: var(--muted); }
  .brief-grid dd { margin: 0; font-weight: 600; }
  table.ledger { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.ledger td, table.ledger th { padding: 5px 4px; border-bottom: 1px solid var(--line); text-align: right; }
  table.ledger td:first-child, table.ledger th:first-child { text-align: left; }
  table.ledger th { font-size: 12px; color: var(--muted); font-weight: 600; }
  .num { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .equation { margin-top: 8px; font-size: 13px; }
  .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    padding: 2px 9px;
    border-radius: 999px;
    vertical-align: middle;
  }
  .tag.pass { background: var(--green-bg); color: var(--green); }
  .tag.fail { background: var(--red-bg); color: var(--red); }
  .tag.pending { background: var(--amber-bg); color: var(--amber); }
  .tag.info { background: var(--slate-bg); color: var(--slate); }
  .tag.standby { background: #fff; color: var(--muted); border: 1px dashed #a8a49a; }
  .reason {
    background: #f4f2ee;
    border-radius: 6px;
    padding: 8px 10px;
    margin: 6px 0 10px;
    font-size: 14px;
  }
  .reason .who { color: var(--muted); font-size: 12px; display: block; margin-bottom: 2px; }
  #feed { list-style: none; margin: 0; padding: 0; }
  #feed li { padding: 8px 2px; border-bottom: 1px solid var(--line); font-size: 14px; }
  #feed li:last-child { border-bottom: none; }
  #feed .t { color: var(--muted); font-size: 12px; margin-right: 8px; }
  #feed .say { color: var(--muted); font-style: italic; }
  .check { display: flex; gap: 8px; align-items: baseline; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .check:last-child { border-bottom: none; }
  .check .name { font-weight: 700; min-width: 96px; }
  .check .why { color: var(--muted); font-size: 13px; }
  #creative { width: 100%; border-radius: 6px; border: 1px solid var(--line); display: block; }
  .rank { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .rank:last-child { border-bottom: none; }
  .bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: #e7e3d9; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--slate); border-radius: 3px; }
  .rank.first .bar i { background: var(--green); }
  .empty { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<header class="top">
  <div class="wordmark">BAZAAR<small>trust layer for creative procurement</small></div>
  <div class="status">
    <span id="conn"><span class="dot" id="dot"></span><span id="conn-text">connecting…</span></span>
    <span class="reserve" id="reserve">reserve —</span>
  </div>
</header>
<main>
  <div>
    <section class="panel">
      <h2>Deal tape</h2>
      <ul id="feed"><li class="empty">Waiting for the first deal…</li></ul>
    </section>
  </div>
  <div>
    <section class="panel">
      <h2>Brief <span id="deal-id" class="tag info">no deal yet</span></h2>
      <div id="brief"><p class="empty">The next brief appears here.</p></div>
    </section>
    <section class="panel">
      <h2>Ledger</h2>
      <div id="ledger"><p class="empty">No escrow yet.</p></div>
    </section>
    <section class="panel">
      <h2>Deliverable</h2>
      <div id="deliverable"><p class="empty">No creative delivered yet.</p></div>
    </section>
    <section class="panel">
      <h2>Inspection</h2>
      <div id="inspection"><p class="empty">Nothing inspected yet.</p></div>
    </section>
    <section class="panel">
      <h2>Reputation</h2>
      <div id="reputation"><p class="empty">No deals settled yet.</p></div>
    </section>
  </div>
</main>
<script>
"use strict";
/* The viewer reads the server-sent event stream only. No fetch, no polling. */
var feed = document.getElementById("feed");
var firstEvent = true;

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c];
  });
}
function stamp(ts) {
  var d = new Date(ts * 1000);
  return d.toTimeString().slice(0, 8);
}
function standbyTag(sim) {
  return sim ? ' <span class="tag standby">standby</span>' : "";
}
function tape(html, ts) {
  if (firstEvent) { feed.innerHTML = ""; firstEvent = false; }
  var li = document.createElement("li");
  li.innerHTML = '<span class="t">' + stamp(ts) + "</span>" + html;
  feed.insertBefore(li, feed.firstChild);
  while (feed.children.length > 60) feed.removeChild(feed.lastChild);
}

function showBrief(dealId, b) {
  document.getElementById("deal-id").textContent = dealId;
  document.getElementById("brief").innerHTML =
    '<dl class="brief-grid">' +
    "<dt>Product</dt><dd>" + esc(b.product) + "</dd>" +
    "<dt>Market</dt><dd>" + esc(b.market) + "</dd>" +
    "<dt>Format</dt><dd>" + esc(b.format) + "</dd>" +
    "<dt>Objects</dt><dd>" + esc(b.required_objects.join(", ")) + "</dd>" +
    '<dt>Budget</dt><dd class="num">' + esc(b.budget) + " credits</dd>" +
    "</dl>";
  document.getElementById("deliverable").innerHTML =
    '<p class="empty">No creative delivered yet.</p>';
  document.getElementById("inspection").innerHTML =
    '<p class="empty">Nothing inspected yet.</p>';
}

function showLedger(ledger) {
  var rows = Object.keys(ledger.balances).map(function (k) {
    return "<tr><td>" + esc(k) + '</td><td class="num">' + ledger.balances[k] + "</td></tr>";
  }).join("");
  var locks = Object.keys(ledger.locks);
  var lockRows = locks.length ? locks.map(function (k) {
    var l = ledger.locks[k];
    return "<tr><td>" + esc(k) + " (" + esc(l.owner) + ')</td><td class="num">' + l.amount + "</td></tr>";
  }).join("") : '<tr><td>—</td><td class="num">0</td></tr>';
  var bals = Object.keys(ledger.balances).reduce(function (a, k) { return a + ledger.balances[k]; }, 0);
  var locked = locks.reduce(function (a, k) { return a + ledger.locks[k].amount; }, 0);
  document.getElementById("ledger").innerHTML =
    '<table class="ledger"><tr><th>Account</th><th>Credits</th></tr>' + rows +
    '<tr><th>Escrow locks</th><th></th></tr>' + lockRows + "</table>" +
    '<div class="equation num">' + bals + " + " + locked + " = " + ledger.reserve +
    (ledger.invariant_holds ? ' <span class="tag pass">holds</span>'
                            : ' <span class="tag fail">broken</span>') + "</div>";
  document.getElementById("reserve").textContent =
    "balances " + bals + " + locks " + locked + " = reserve " + ledger.reserve;
}

function showDeliverable(p) {
  document.getElementById("deliverable").innerHTML =
    '<img id="creative" alt="delivered ad creative">' +
    '<p class="empty">Attempt ' + esc(p.attempt) + " · " + esc(p.provenance || "unknown source") +
    standbyTag(p.simulated) + "</p>";
  document.getElementById("creative").src = p.image;
}

function showInspection(p) {
  var v = p.verdict;
  var html = v.checks.map(function (c) {
    return '<div class="check"><span class="name">' + esc(c.name) + "</span>" +
      (c.passed ? '<span class="tag pass">pass</span>' : '<span class="tag fail">fail</span>') +
      '<span class="why">' + esc(c.reason) + "</span></div>";
  }).join("");
  document.getElementById("inspection").innerHTML =
    '<p>Attempt ' + esc(p.attempt) + " — " +
    (v.passed ? '<span class="tag pass">creative accepted</span>'
              : '<span class="tag fail">creative rejected</span>') + "</p>" + html +
    '<p class="empty num">sha256 ' + esc(v.image_hash.slice(0, 16)) + "…</p>";
}

function showReputation(ranking) {
  var top = Math.max.apply(null, ranking.map(function (r) { return Math.abs(r.score); }).concat([1]));
  document.getElementById("reputation").innerHTML = ranking.map(function (r, i) {
    var width = Math.max(4, Math.abs(r.score) / top * 100);
    return '<div class="rank' + (i === 0 ? " first" : "") + '">' +
      "<span>" + (i + 1) + ". " + esc(r.seller) +
      ' <span class="empty">· ' + r.wins + " wins / " + r.deals + " deals</span></span>" +
      '<span class="num">' + r.score.toFixed(1) + "</span>" +
      '<span class="bar"><i style="width:' + width + '%"></i></span></div>';
  }).join("");
}

var source = new EventSource("/events");
source.onopen = function () {
  document.getElementById("dot").className = "dot live";
  document.getElementById("conn-text").textContent = "live";
};
source.onerror = function () {
  document.getElementById("dot").className = "dot";
  document.getElementById("conn-text").textContent = "reconnecting…";
};

function on(type, fn) {
  source.addEventListener(type, function (ev) {
    var frame = { payload: JSON.parse(ev.data), ts: Date.now() / 1000 };
    fn(frame.payload, frame.ts);
  });
}

on("deal_opened", function (p, ts) {
  showBrief(p.deal_id, p.brief);
  tape("<b>" + esc(p.deal_id) + "</b> opened — " + esc(p.brief.product) +
       " (" + esc(p.brief.market) + "), budget <span class='num'>" +
       esc(p.brief.budget) + "</span> credits.", ts);
});
on("sellers_ranked", function (p, ts) {
  showReputation(p.ranking);
  tape("Sellers enter in reputation order: " +
       esc(p.ranking.map(function (r) { return r.seller; }).join(", ")) + ".", ts);
});
on("offer", function (p, ts) {
  tape("<span class='tag info'>offer</span> " + esc(p.seller) + " asks " +
       "<span class='num'>" + esc(p.price) + "</span>" + standbyTag(p.simulated) +
       ' <span class="say">“' + esc(p.reason) + "”</span>", ts);
});
on("counter", function (p, ts) {
  tape("<span class='tag pending'>counter</span> buyer offers " + esc(p.seller) +
       " <span class='num'>" + esc(p.price) + "</span>" + standbyTag(p.simulated) +
       ' <span class="say">“' + esc(p.reason) + "”</span>", ts);
});
on("accept", function (p, ts) {
  tape("<span class='tag pass'>accept</span> " + esc(p.seller) + " at " +
       "<span class='num'>" + esc(p.price) + "</span>" + standbyTag(p.simulated) +
       ' <span class="say">“' + esc(p.reason) + "”</span>", ts);
});
on("walk", function (p, ts) {
  tape("<span class='tag fail'>walk</span> " + esc(p.actor) +
       (p.seller ? " from " + esc(p.seller) : "") + standbyTag(p.simulated) +
       ' <span class="say">“' + esc(p.reason) + "”</span>", ts);
});
on("deal_walked", function (p, ts) {
  tape("<b>" + esc(p.deal_id) + "</b> closed with no agreement. " +
       "<span class='say'>" + esc(p.reason) + "</span>", ts);
});
on("escrow_locked", function (p, ts) {
  showLedger(p.ledger);
  tape("Escrow locked: <span class='num'>" + esc(p.amount) +
       "</span> credits (" + esc(p.lock_id) + ").", ts);
});
on("deliverable", function (p, ts) {
  showDeliverable(p);
  tape("Creative delivered, attempt " + esc(p.attempt) +
       " (" + esc(p.provenance || "?") + ")" + standbyTag(p.simulated) + ".", ts);
});
on("inspection", function (p, ts) {
  showInspection(p);
  var v = p.verdict;
  tape("Inspection, attempt " + esc(p.attempt) + ": " +
       (v.passed ? "<span class='tag pass'>pass</span>"
                 : "<span class='tag fail'>reject</span>"), ts);
});
on("retry", function (p, ts) {
  tape("<span class='tag pending'>retry</span> one more attempt. " +
       '<span class="say">' + esc(p.feedback) + "</span>", ts);
});
on("settled", function (p, ts) {
  showLedger(p.ledger);
  tape("<b>" + esc(p.deal_id) + "</b> <span class='tag pass'>settled</span> — " +
       "<span class='num'>" + esc(p.price) + "</span> credits to " +
       esc(p.seller) + ".", ts);
});
on("refunded", function (p, ts) {
  showLedger(p.ledger);
  tape("<b>" + esc(p.deal_id) + "</b> <span class='tag fail'>refunded</span> — " +
       esc(p.reason) + ".", ts);
});
on("reputation", function (p, ts) {
  showReputation(p.ranking);
  var top = p.ranking[0];
  tape("Re-ranked: " + esc(top.seller) + " leads at " +
       "<span class='num'>" + top.score.toFixed(1) + "</span>.", ts);
});
on("deal_error", function (p, ts) {
  tape("<span class='tag fail'>error</span> " + esc(p.error), ts);
});
</script>
</body>
</html>
